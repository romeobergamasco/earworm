[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earworm"
version = "0.1.0"
description = "Music recognition by hand-written audio fingerprints, with similar songs and genre prediction."
readme = "README.md"
requires-python = ">=3.12"  # Colab may run a newer Python
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "av>=12",  # decodes m4a / aac / webm / opus without a system ffmpeg
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
embed = [  # local indexer only (T18/T19); CPU wheels: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.4",
    "transformers>=4.45",
]
eval = [  # measurement sessions (T26): QR code of the session link in the terminal
    "segno>=1.6",
]
notebook = [
    "nbformat>=5",
    "nbconvert>=7",
    "ipykernel>=6",
    "scikit-learn>=1.5",
    "pandas>=2",  # FMA metadata (indexer/fma.py)
    "remotezip>=0.12",  # reads only the chosen FMA clips from the zip
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "sounddevice>=0.4",
    "httpx>=0.27",  # FastAPI TestClient
]

[tool.setuptools.packages.find]
include = ["earworm*", "indexer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]  # analysis notebooks: generated by notebooks/make_*.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/make_*.py" = ["E501"]  # notebook cells and their French prose, kept as written
